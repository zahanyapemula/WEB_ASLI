<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganti Password - Web PKM</title>
<link rel="icon" type="image/png" href="ikon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
<script src="site-config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<main class="login-page">
  <div class="brand"><img src="logo.png" alt="Web PKM" class="brand"></div>
  <div class="illustration"><img src="ikon login.png" alt="Ganti Password" class="illustration"></div>
  <section class="login-header">
    <h1>Ganti <span>Password</span></h1>
    <p>Buat password baru untuk akun Anda.</p>
  </section>
  <form class="login-card" id="resetForm" novalidate>
    <div class="form-group">
      <label for="newPassword">Password Baru</label>
      <div class="input-wrapper">
        <span class="input-icon">♙</span>
        <input type="password" id="newPassword" autocomplete="new-password" placeholder="Minimal 6 karakter">
      </div>
      <small class="error-message" id="newPasswordError"></small>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Konfirmasi Password</label>
      <div class="input-wrapper">
        <span class="input-icon">♙</span>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Ulangi password baru">
      </div>
      <small class="error-message" id="confirmPasswordError"></small>
    </div>
    <button type="submit" class="login-button" id="resetButton">Simpan Password</button>
    <p class="auth-status" id="resetStatus" aria-live="polite"></p>
  </form>
</main>
<script src="reset-password.js"></script>
</body>
</html>
